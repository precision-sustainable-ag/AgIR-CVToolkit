# Detection Inference Configuration
# Place this in: conf/det_inference/default.yaml

# Model configuration
model:
  weights: /home/psa_images/SemiF-PlantDetection/projects/synthetic_data_gen_train/001/train/models/run7/weights/last.pt #"last.pt"  # Path to YOLO model weights

# Multiscale inference settings
multiscale:
  # scales: [0.5, 0.75, 1.0, 1.25, 1.5]  # Scale factors for multiscale inference
  scales: [0.15, 0.25, 0.5, 1.0, 1.5]
  base_imgsz: 2880  # Base image size (will be scaled by factors above)
  
  # Per-scale inference parameters
  per_scale_conf: 0.00  # Low confidence threshold per scale (before fusion)
  per_scale_iou: 1.0     # IoU threshold for NMS per scale
  per_scale_max_det: 2000 # Max detections per scale
  
fusion:
  iou_thr: 0.65        # IoU threshold for weighted boxes fusion
  skip_box_thr: 0.0      # Boxes with confidence below this are skipped in fusion
  conf_type: "max"       # Method to combine confidences: "avg", "max", etc.
  score_power: 1.0       # Power to raise scores during fusion

edge_aware_filter:
  edge_band_rel: 0.08    # Relative width of edge band
  min_factor: 0.50       # Minimum factor to reduce confidence at edges
  taper_rel: 0.20        # Relative width of tapering region

# Third tier: Optional extra NMS right after WBF (before Ultralytics NMS)
post_fusion_nms:
  enabled: true   # set true to turn it on
  iou: 0.60        # IoU threshold for batched_nms

# Final NMS parameters (after fusion)
final_nms:
  conf: 0.7     # Final confidence threshold
  iou: 0.55      # Final NMS IoU threshold
  max_det: 2000   # Maximum final detections

# GPU configuration
gpu:
  exclude_ids: []      # GPU IDs to exclude
  min_free_gb: 8.0     # Minimum free GPU memory (GB)

# Output settings
output:
  save_visualizations: true  # Save detection visualizations
  save_txt: false            # Save results in YOLO txt format
  save_json: true            # Save results in JSON format
  
  # Visualization settings
  draw_labels: true
  draw_boxes: true
  draw_conf: true
  line_width: 10
  font_size: 0.5

# Source configuration (automatically populated from query stage)
source:
  db: "semif"  # Database used in query
  custom:
    enabled: false
    image_dir: "/home/mkutuga/svs-raw-api/data/jpgs/MD_2025-10-20"  # Custom directory if applicable