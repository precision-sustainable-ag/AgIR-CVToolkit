# src/agir_cvtoolkit/conf/globus/default.yaml
#
# Globus transfer configuration for AgIR-CVToolkit.
# Source is always Juno LTS. Destination is selected with --dst on the CLI.

# ---- Source endpoint (always Juno) ----
juno_endpoint: # <juno endpoint>   # SCINet-Juno (LTS)
src_root: "/LTS/project/dash_agir/"

# Endpoint where `agir-cv` runs. Only used to also copy this run's local
# folder (logs, query results, cfg.yaml, globus_batch.txt) alongside the
# transferred files. Leave blank to skip; not needed for the data transfer.
local_endpoint: # <local endpoint you're currently on>

# ---- Named destinations ----
# Select one at runtime with:  agir-cv scinet-transfer --dst ceres
# dst_root is shared; agir-cv namespaces it by project.name/subname
# (conf/config.yaml) to avoid collisions. Add new destinations here.
destinations:
  ceres:
    endpoint: # <ceres endpoint>   # SCINet-Ceres
    dst_root: "/90daydata/dash_agir/tmp/"
  atlas:
    endpoint: # <atlas endpoint>   # SCINet-Atlas
    dst_root: "/90daydata/dash_agir/tmp/"

# ---- Default destination (used when --dst is not passed) ----
default_dst: "ceres"

# ---- Transfer options ----
transfer:
  # globus transfer sync-level: one of checksum | mtime | exists | size
  sync_level: "checksum"
  label_prefix: "agir-cv scinet-transfer"
  # If true, block until the task reaches SUCCEEDED/FAILED (or timeout).
  wait: false
  poll_interval_s: 10
  timeout_s: 300

# ---- Path column heuristics ----
# Columns inspected (in order) when building per-record source paths.
path_columns:
  - cropout_path
  - cutout_path
  - cutout_mask_path
  - cutout_json_path