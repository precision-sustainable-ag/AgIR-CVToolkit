# Configuration for segmentation inference pipeline
# Segmentation inference configuration
# Data source
source:
  type: "query_result"  # "query_result" | "db_query"
  db: "semif"       # "semif" | "field"
  custom: 
    enabled: true
    mode: segment_bboxes  # "segment_bboxes" (segment only within bbox detections) | "segment_images" (segment entire image)
    image_dir: #/home/mkutuga/svs-raw-api/data/jpgs/MD_2025-10-14  # Custom directory if applicable
    label_json_path: #/home/mkutuga/AgIR-CVToolkit/outputs/runs/test/001/plots/detections.json

  
  
  # Specify whether to use full images or cutouts
  image_mode: "cutout"  # "cutout" | "full_image"
  # - "cutout": Use cropout_path or crop from image_path using bbox (default behavior)
  # - "full_image": Always use the full image_path, ignore bbox and cropout_path
  
  # Filters (only used when type="db_query")
  filters:
    state: #"NC"
    # category_common_name: ["barley", "winter wheat", "cereal rye"]
  
  # Sampling (optional)
  sample:
    strategy: #"stratified"  # "random" | "seeded" | "stratified"
    by: # ["category_common_name", "area_bin"]
    per_group: # 10
    # seed: 42  # for seeded/stratified
  
  # Limit (optional)
  limit: # 1000

# GPU configuration
gpu:
  max_gpus: 1
  exclude_ids: [0]

# Model configuration
model:
  arch: "unet"  # "unet" | "deeplabv3plus" | "segformer"
  encoder_name: "mit_b4"
  in_channels: 3
  num_classes: 1  # 1=binary, >=2 multi-class
  encoder_weights: "imagenet"
  pad_divisor: 32
  strict_load: true
  
  # Checkpoint path (REQUIRED - override via CLI)
  ckpt_path: /home/mkutuga/Field-SegmentationTraining/projects/PSA_15164_393_unets/train_2025-10-10_08_36_13/checkpoints/epoch=47-step=37200-val_loss=0.00.ckpt
  # ckpt_path: /home/yourusername/Field-SegmentationTraining/projects/PSA_15164_393_unets/train_2025-10-10_08_36_13/checkpoints/epoch=47-step=37200-val_loss=0.00.ckpt # mit_b4
  
  # Normalization parameters
  normalization:
    mean: [0.41402342925576485, 0.39733920011077273, 0.307018603782374] # [0.387073605995068,0.37504915320836685, 0.2874635005985575]
    std: [0.16444163299636838, 0.1441124174531256, 0.14779539166305755] # [0.17819966530480363, 0.15686458664146127, 0.15478363135797227]

# Tiled inference configuration
tile:
  height: 1024
  width: 1024
  overlap: 0.5      # 0.0 to 0.95
  pad_mode: "reflect"  # "reflect" | "constant"

# Post-processing
post_process:
  threshold: 0.5              # Binary threshold
  min_area: 0                 # Min connected component area (pixels)
  edge_occupancy_threshold: null  # Skip if edge > threshold (0.0-1.0)

# Output configuration
output:
  save_masks: false
  save_images: false
  save_cutouts: true
  save_viz: true
  
  cutout_use_rgba: true  # Use RGBA for cutouts if saving cutouts
  
  # Colorization options
  save_colorized_masks: false  # Save RGB colorized masks
  colorize_brightness: 3.5     # Brightness enhancement factor (1.0 = no change)
  colorize_rgb_field: "category_rgb"  # Field to read RGB from: "category_rgb" or "rgb"
  colorize_fallback_rgb: "category_class_id"  # Fallback RGB if field missing/invalid

# Visualization (only used if save_visualizations=true)
visualization:
  enabled: true
  overlay_alpha: 0.5


# Runtime config (populated by hydra_utils.py)
runtime: {}
paths: {}