name: agcv
channels:
  - conda-forge

dependencies:
  # === Core ===
  - python=3.13
  - pip

  # === Development / Testing ===
  - pytest
  - black
  - ruff
  - mypy

  # === Pip-installed Packages ===
  - pip:
      # ---- Configuration / CLI ----
      - hydra-core>=1.3
      - typer>=0.12
      - pydantic>=2.6
      - rich>=13
      - pyyaml

      # ---- Data Handling ----
      - pandas>=2.0
      - pyarrow>=21.0.0
