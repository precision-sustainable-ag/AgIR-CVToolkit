[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agir-cvtoolkit"
version = "0.1.0"
description = "AgIR CV Toolkit: query the AgIR database and fetch the matching files."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "DASH" }]

dependencies = [
  # --- Core / CLI / Config ---
  "hydra-core>=1.3",
  "typer>=0.12",
  "pydantic>=2.6",
  "rich>=13",
  "pyyaml",

  # --- Data / I/O ---
  "pandas>=2.0",
  "pyarrow>=21.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.scripts]
agir-cv = "agir_cvtoolkit.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agir_cvtoolkit" = ["**/*.yaml", "**/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
