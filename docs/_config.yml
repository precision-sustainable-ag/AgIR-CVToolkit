# _config.yml
title: Ag Image Repo
description: Agricultural Image Repository

# Theme
theme: just-the-docs

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Color scheme
color_scheme: light

# Callouts
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Pro Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# Plugins
plugins:
  - jekyll-seo-tag

# Aux links (top right corner)
aux_links:
  "GitHub Repository":
    - "//github.com/precision-sustainable-ag/AgIR-CVToolkit"
  
# Footer
# footer_content: "Copyright &copy; 2025 Digital Agricultural Systems Hub. <a href='https://github.com/precision-sustainable-ag/AgIR-CVToolkit'>View on GitHub</a>"
footer_content: "<a href='https://github.com/precision-sustainable-ag/AgIR-CVToolkit'>View on GitHub</a>"